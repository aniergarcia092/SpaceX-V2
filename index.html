<!DOCTYPE html>

  <style>
    html, body { margin: 0; height: 100%; background: #120a0b; overflow: hidden; font-family: system-ui, sans-serif; color: #eee; }
    #app { position: fixed; inset: 0; }
    /* ---------- Pantalla de inicio ---------- */
    #menu-inicio { position: fixed; inset: 0; z-index: 50; overflow: hidden; display: flex; align-items: center; justify-content: center;

    #menu-inicio .planeta::after { content: ""; position: absolute; inset: 0; border-radius: 50%; opacity: .35;

    #menu-inicio .contenido { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 2.6vh, 20px);

    #menu-inicio button:active { transform: scale(.97); }
    #menu-inicio button .ic { font-size: clamp(22px, 4.4vh, 32px); }

    #menu-inicio .estado { display: none; align-items: center; gap: 10px; margin: 2px 0 0; font-size: 11px; letter-spacing: .2em; color: #e0bfa4; text-transform: uppercase; }
    #menu-inicio.cargando .estado { display: flex; }
    #menu-inicio.cargando button { opacity: .7; }
    #menu-inicio .estado i { position: relative; width: 90px; height: 3px; overflow: hidden; border-radius: 2px; background: rgba(255,255,255,.14); }
    #menu-inicio .estado i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; background: #ffc83a; animation: carga 1.1s ease-in-out infinite; }
    @keyframes titilar { from { opacity: .55; } to { opacity: 1; } }
    @keyframes brillo { 0%, 100% { filter: drop-shadow(0 4px 0 #3a150c) drop-shadow(0 0 18px rgba(255,140,40,.35)); } 50% { filter: drop-shadow(0 4px 0 #3a150c) drop-shadow(0 0 34px rgba(255,170,60,.65)); } }
    @keyframes conducir { from { transform: translateX(-120px); } to { transform: translateX(105vw); } }
    @keyframes bote { from { transform: translateY(0); } to { transform: translateY(-1.5px); } }
    @keyframes flotar { from { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } to { transform: translate(40px, -62vh); opacity: 0; } }
    @keyframes carga { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #menu-inicio *, #menu-inicio *::before, #menu-inicio *::after { animation: none !important; } }
    .oculto { display: none !important; }
    #btn-rover, #btn-atacar, #btn-reiniciar { position: fixed; z-index: 20; display: none; font-size: 18px;
      padding: 12px 16px; border: 0; border-radius: 12px; background: rgba(255,154,46,.9); color: #120a0b; }
    body.movil #btn-rover, body.movil #btn-atacar, body.movil #btn-reiniciar { display: block; }
    /* Móvil en horizontal: hay poca altura, así que los botones bajan para no tapar el joystick ni el botón del mapa */
    #btn-rover { left: 160px; bottom: 24px; }
    #btn-atacar { right: 12px; bottom: 24px; }
    #btn-reiniciar { left: 50%; top: 40%; transform: translateX(-50%); }
    /* Móvil: el juego es horizontal. Si el teléfono está en vertical se tapa con un aviso para girarlo. */
    #girar { position: fixed; inset: 0; z-index: 9999; display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 10px; background: #120a0b; text-align: center; font-size: 20px; padding: 20px; }
    #girar span { font-size: 56px; display: inline-block; transform: rotate(90deg); }
    @media (orientation: portrait) { body.movil #girar { display: flex; } }
  
    /* ---------- Rediseño visual: estética sci-fi cinematográfica ---------- */
    #menu-inicio {

    #menu-inicio .planeta {

    #menu-inicio .dunas { height:38%; filter:drop-shadow(0 -12px 24px rgba(255,123,74,.08)); }

    #menu-inicio .capitulo::before, #menu-inicio .capitulo::after { height:1px; width:clamp(28px, 7vw, 76px); background:linear-gradient(90deg, transparent, #ffb46d); }
    #menu-inicio h1 {

      background:linear-gradient(180deg, #fff8e7 0%, #ffdba0 25%, #ff9c62 65%, #f05b48 100%);
      -webkit-background-clip:text; background-clip:text; filter:drop-shadow(0 3px 0 rgba(48,20,35,.95)) drop-shadow(0 0 28px rgba(255,133,89,.3));

    #menu-inicio .opciones { gap:14px; margin-top:clamp(8px, 2vh, 18px); max-width:620px; }
    #menu-inicio button {
      position:relative; flex:1 1 220px; max-width:300px; gap:16px; padding:clamp(13px, 2vh, 18px) 20px;
      border:1px solid rgba(255,206,166,.32); border-radius:15px; color:#fff8f0;
      background:linear-gradient(135deg, rgba(255,183,126,.13), rgba(25,22,43,.72) 58%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.09), 0 12px 35px rgba(0,0,0,.18);
      clip-path:none; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      transition:transform .22s ease, border-color .22s ease, background .22s ease, box-shadow .22s ease;
    }
    #menu-inicio button::after { content:""; position:absolute; left:18px; right:18px; bottom:0; height:2px; border-radius:2px; background:linear-gradient(90deg, transparent, #ffb46d, transparent); opacity:.65; }
    #menu-inicio button:hover, #menu-inicio button:focus-visible {
      outline:none; transform:translateY(-4px); border-color:rgba(255,205,153,.82);
      background:linear-gradient(135deg, rgba(255,183,126,.24), rgba(39,27,49,.88) 65%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.13), 0 18px 42px rgba(0,0,0,.28), 0 0 24px rgba(255,153,99,.1);
    }
    #menu-inicio button:active { transform:translateY(-1px) scale(.985); }
    #menu-inicio button .ic {
      display:grid; place-items:center; width:48px; height:48px; flex:0 0 48px;
      border:1px solid rgba(255,202,159,.25); border-radius:12px; background:rgba(255,177,120,.1); font-size:clamp(23px, 4vh, 30px);
    }
    #menu-inicio button b { font-size:clamp(14px, 2.5vh, 17px); letter-spacing:.14em; }
    #menu-inicio button small { margin-top:5px; color:rgba(255,222,202,.72); font-size:clamp(10px, 1.6vh, 12px); letter-spacing:.025em; }
    #menu-inicio .estado { color:#f5c9a9; font-size:10px; letter-spacing:.18em; }
    #menu-inicio .estado i { width:100px; height:3px; background:rgba(255,255,255,.16); }
    #menu-inicio .estado i::after { background:linear-gradient(90deg, #ff8b68, #ffe0a3); box-shadow:0 0 10px rgba(255,164,104,.7); }
    #btn-rover, #btn-atacar, #btn-reiniciar {

<body>
  <div id="menu-inicio">
    <div class="estrellas"></div>
    <div class="planeta"></div>
    <i class="polvo" style="--x:8%;--d:15s;--t:-2s"></i><i class="polvo" style="--x:21%;--d:19s;--t:-9s"></i>

      <path d="M0 120 C150 70 300 150 480 110 S800 60 1000 120 S1150 100 1200 110 V240 H0 Z" fill="#5a2417"/>
      <path d="M0 160 C200 120 340 190 560 150 S900 120 1200 170 V240 H0 Z" fill="#3a170f"/>
      <path d="M0 205 C250 175 450 225 700 195 S1050 180 1200 205 V240 H0 Z" fill="#1c0b08"/>
    </svg>
    <div class="paisaje-rover" aria-hidden="true">
      <svg viewBox="0 0 96 44">
        <g fill="#0d0607" stroke="#ff9a2e" stroke-width="1.3" stroke-linejoin="round">
          <rect x="14" y="12" width="62" height="14" rx="4"/><rect x="38" y="4" width="26" height="10" rx="3"/>
          <path d="M70 12 L83 3" fill="none"/><circle cx="22" cy="32" r="8"/><circle cx="48" cy="32" r="8"/><circle cx="74" cy="32" r="8"/>
        </g>
        <circle cx="78" cy="19" r="2.2" fill="#ffc83a"/><circle cx="83" cy="3" r="1.6" fill="#ff4a5a"/>
      </svg>

      <div class="capitulo">CAPÍTULO 1</div>
      <h1>COLONIA</h1>
      <p class="lema">Aterriza · Construye · Escucha la señal</p>
      <div class="opciones">
        <button data-modo="pc"><span class="ic">🖥️</span><span><b>PC</b><small>Teclado y ratón</small></span></button>
        <button data-modo="movil"><span class="ic">📱</span><span><b>MÓVIL</b><small>Pantalla táctil · en horizontal</small></span></button>

  <div id="app"></div>
  <button id="btn-rover" class="oculto">🎯</button>
  <button id="btn-atacar" class="oculto">⚔️</button>
  <button id="btn-reiniciar" class="oculto">🔄</button>

  <div id="girar"><span>📱</span>Gira el teléfono a horizontal</div>
  <script>
    // Al elegir Móvil: pantalla completa y bloqueo en horizontal.
    // Los navegadores solo permiten bloquear la orientación en pantalla completa, y lo rechazan sin avisar si no se cumple
    // (en ese caso queda el aviso de "gira el teléfono" como respaldo).
    document.querySelector('[data-modo="movil"]').addEventListener('click', async () => {
      try { await document.documentElement.requestFullscreen(); } catch (e) {}
      try { await screen.orientation.lock('landscape'); } catch (e) {}
    });
  </script>
  <script>
    // Mientras main.js carga (en el móvil puede tardar), el menú lo avisa; si tocas un modo antes de tiempo, entra solo en cuanto esté listo.
    (function () {
      var menu = document.getElementById('menu-inicio'), btns = menu.querySelectorAll('button'), txt = menu.querySelector('.txt'), elegido = null;
      menu.classList.add('cargando');
      btns.forEach(function (b) { b.addEventListener('click', function () { if (!b.onclick) { elegido = b; txt.textContent = 'Entrando…'; } }); });
      var iv = setInterval(function () {
        if (!document.getElementById('menu-inicio')) return clearInterval(iv);
        if (btns[0].onclick) { clearInterval(iv); menu.classList.remove('cargando'); if (elegido) elegido.click(); }
      }, 100);
    })();
  </script>
