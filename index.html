  <div id="lobby" data-vista="inicio" role="dialog" aria-modal="true" aria-label="Multijugador">
    <div class="caja">
      <button class="cerrar" id="lb-x" title="Cerrar" aria-label="Cerrar">✕</button>

      <p class="sub">Construyan juntos en el mismo mapa · hasta 3 jugadores</p>
      <p class="preview">VISTA PREVIA · la conexión real todavía no está activada, solo se ve cómo será el menú.</p>

      <div class="vista v-inicio">
        <label for="lb-nombre">TU NOMBRE</label>
        <input id="lb-nombre" maxlength="14" placeholder="Comandante" autocomplete="off" spellcheck="false">

        <div class="sep">O UNIRSE A UNA</div>
        <div class="fila">
          <input id="lb-codigo" class="cod" maxlength="5" placeholder="CÓDIGO" autocomplete="off" spellcheck="false" aria-label="Código de la sala">
          <button class="cian" id="lb-unirse">UNIRSE</button>
        </div>
      </div>

      <div class="vista v-sala">
        <label>CÓDIGO DE LA SALA · TOCA PARA COPIAR</label>
        <div class="codigo" id="lb-copiar" title="Copiar código"><b id="lb-cod">-----</b><small id="lb-copiado">📋</small></div>
        <label>JUGADORES <span id="lb-cuenta">1/3</span></label>
        <div class="slots" id="lb-slots"></div>
        <label>MAPA</label>
        <div class="opts" id="lb-mapas">
          <button data-v="aleatorio">🎲 Aleatorio</button><button data-v="valle">🏜️ Valle Rojo</button><button data-v="canon">🪨 Gran Cañón</button><button data-v="crateres">🌑 Cráteres</button><button data-v="glaciar">🧊 Glaciar</button>
        </div>
        <p class="desc-m" id="lb-descmapa"></p>
        <label>TAMAÑO</label>
        <div class="opts" id="lb-tam">
          <button data-v="normal">Normal</button><button data-v="grande">Grande</button><button data-v="muy">Muy grande</button>
        </div>
        <label>CAÑONES (RELIEVE)</label>
        <div class="opts" id="lb-can">
          <button data-v="sin">Sin cañones</button><button data-v="pocos">Pocos</button><button data-v="normales">Normales</button><button data-v="muchos">Muchos</button>
        </div>
        <div class="fila"><button class="pri" id="lb-iniciar">▶ INICIAR PARTIDA</button></div>
        <div class="fila"><button class="txt" id="lb-salir">⬅ SALIR DE LA SALA</button></div>

  <div id="app"></div>
  <button id="btn-rover" class="oculto">🎯</button>
  <button id="btn-atacar" class="oculto">⚔️</button>
  <button id="btn-reiniciar" class="oculto">🔄</button>

  <div id="girar"><span>📱</span>Gira el teléfono a horizontal</div>
  <script>
    // Multijugador (menú): el botón abre la sala. Va ANTES de los otros scripts para que, mientras la conexión real no esté enganchada,
    // pulsar "Multijugador" no arranque una partida en solitario. La red se engancha rellenando window.ColoniaLobby.onCrear / onUnirse / onIniciar / onSalir
    // y llamando a mostrarSala(codigo, jugadores, soyHost) · setJugadores(lista) · setEstado(texto, esError) · cerrar().
    (function () {
      var $ = function (s) { return document.querySelector(s); };
      var lobby = $('#lobby'), btn = $('[data-modo="multi"]'), estado = $('#lb-estado'), nombre = $('#lb-nombre'), codigo = $('#lb-codigo');
      var COLORES = ['#ff9a2e', '#5fd0ff', '#5dff8a'], ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      var API = window.ColoniaLobby = { max: 3, onCrear: null, onUnirse: null, onIniciar: null, onSalir: null, codigo: '', soyHost: false, jugadores: [] };
      var demo = function () { return !API.onCrear; };
      function guardar(v) { try { localStorage.setItem('colonia_nombre', v); } catch (e) {} }
      function leer() { try { return localStorage.getItem('colonia_nombre') || ''; } catch (e) { return ''; } }
      function nom() { var n = nombre.value.trim().slice(0, 14) || 'Comandante'; guardar(n); return n; }
      function msg(t, err) { estado.textContent = t || ''; estado.className = 'estado-l' + (err ? ' error' : ''); }
      function vista(v) { lobby.dataset.vista = v; }
      function pintar() {
        var js = API.jugadores, h = '';
        for (var i = 0; i < API.max; i++) {
          var j = js[i];
          h += j ? '<div class="slot" style="--c:' + COLORES[i] + '"><span class="pt">' + (i + 1) + '</span><span class="nm"></span><span class="rol">' + (i === 0 ? 'ANFITRIÓN' : (j.yo ? 'TÚ' : 'AMIGO')) + (i === 0 && j.yo ? ' · TÚ' : '') + '</span></div>'
                   : '<div class="slot vacio"><span class="pt">·</span><span class="nm">Esperando amigo…</span></div>';
        }
        $('#lb-slots').innerHTML = h;
        var nms = lobby.querySelectorAll('.slot:not(.vacio) .nm'); js.forEach(function (j, i) { if (nms[i]) nms[i].textContent = j.nombre; });
        $('#lb-cuenta').textContent = js.length + '/' + API.max;
        var b = $('#lb-iniciar'); b.disabled = !API.soyHost || js.length < 2;
        b.textContent = !API.soyHost ? '⏳ ESPERANDO AL ANFITRIÓN' : js.length < 2 ? '▶ NECESITAS A ALGÚN AMIGO' : '▶ INICIAR PARTIDA';
      }

      // elección de mapa y tamaño: la hace el anfitrión (API.cfg); los demás lo ven en solo lectura
      var DESC = { aleatorio: 'Un mapa nuevo cada partida.', valle: 'Terreno abierto con pocos cañones: ideal para tanques.', canon: 'Cañones profundos y pasos estrechos.', crateres: 'Cráteres por todas partes: mucha roca y mineral.', glaciar: 'Mucho hielo: agua abundante.' };
      API.cfg = { mapa: 'aleatorio', tam: 'normal', can: 'normales' };
      function pintarCfg() {
        [['#lb-mapas', 'mapa'], ['#lb-tam', 'tam'], ['#lb-can', 'can']].forEach(function (p) {
          var box = $(p[0]); box.classList.toggle('lock', !API.soyHost);
          Array.prototype.forEach.call(box.children, function (b) { b.classList.toggle('sel', b.dataset.v === API.cfg[p[1]]); });
        });
        $('#lb-descmapa').textContent = DESC[API.cfg.mapa] || '';
      }
      API.setCfg = function (c) { API.cfg = { mapa: c.mapa || 'aleatorio', tam: c.tam || 'normal', can: c.can || 'normales' }; pintarCfg(); };
      [['#lb-mapas', 'mapa'], ['#lb-tam', 'tam'], ['#lb-can', 'can']].forEach(function (p) {
        $(p[0]).addEventListener('click', function (e) {
          var b = e.target.closest('button'); if (!b || !API.soyHost) return;
          API.cfg[p[1]] = b.dataset.v; pintarCfg(); if (API.onCfg) API.onCfg(API.cfg);
        });
      });
      var _pintar = pintar; pintar = function () { _pintar(); pintarCfg(); };
      API.mostrarSala = function (cod, jugadores, host) { API.codigo = cod; API.soyHost = !!host; API.jugadores = jugadores; $('#lb-cod').textContent = cod; vista('sala'); pintar(); msg(''); };
      API.setJugadores = function (jugadores) { API.jugadores = jugadores; pintar(); };
      API.setEstado = msg;
      API.cerrar = function () { lobby.classList.remove('abierto'); };
      API.volver = function (texto) { API.codigo = ''; API.jugadores = []; vista('inicio'); msg(texto, true); };   // la sala se cerró: vuelve al inicio con un aviso
      function abrir() { lobby.classList.toggle('demo', demo()); lobby.classList.add('abierto'); vista(API.codigo ? 'sala' : 'inicio'); msg(''); if (!API.codigo) setTimeout(function () { nombre.focus(); }, 30); }
      nombre.value = leer();
      btn.addEventListener('click', function (e) { e.stopImmediatePropagation(); e.preventDefault(); abrir(); });
      $('#lb-x').addEventListener('click', API.cerrar);
      lobby.addEventListener('mousedown', function (e) { if (e.target === lobby) API.cerrar(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && lobby.classList.contains('abierto')) API.cerrar(); });
      codigo.addEventListener('input', function () { codigo.value = codigo.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
      codigo.addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#lb-unirse').click(); });
      $('#lb-crear').addEventListener('click', function () {
        if (!demo()) { msg('Creando sala…'); API.onCrear(nom()); return; }
        var c = ''; for (var i = 0; i < 5; i++) c += ABC[Math.floor(Math.random() * ABC.length)];
        API.mostrarSala(c, [{ nombre: nom(), yo: true }], true);
      });
      $('#lb-unirse').addEventListener('click', function () {
        if (codigo.value.length < 5) { msg('Escribe el código de 5 letras que te pasó tu amigo.', true); codigo.focus(); return; }
        if (!demo()) { msg('Conectando…'); API.onUnirse(nom(), codigo.value); return; }
        API.mostrarSala(codigo.value, [{ nombre: 'Amigo' }, { nombre: nom(), yo: true }], false);
      });
      $('#lb-iniciar').addEventListener('click', function () { if (!demo() && API.onIniciar) API.onIniciar(); else msg('En la vista previa no arranca la partida.'); });
      $('#lb-salir').addEventListener('click', function () { if (API.onSalir) API.onSalir(); API.codigo = ''; API.jugadores = []; vista('inicio'); msg(''); });
      $('#lb-copiar').addEventListener('click', function () {
        var ok = function () { var s = $('#lb-copiado'); s.textContent = '✔ COPIADO'; setTimeout(function () { s.textContent = '📋'; }, 1400); };
        try { navigator.clipboard.writeText(API.codigo).then(ok, function () {}); } catch (e) {}
      });
    })();
  </script>
  <script>
    // Al elegir Móvil: pantalla completa y bloqueo en horizontal.
    // Los navegadores solo permiten bloquear la orientación en pantalla completa, y lo rechazan sin avisar si no se cumple
    // (en ese caso queda el aviso de "gira el teléfono" como respaldo).
    document.querySelector('[data-modo="movil"]').addEventListener('click', async () => {
      try { await document.documentElement.requestFullscreen(); } catch (e) {}
      try { await screen.orientation.lock('landscape'); } catch (e) {}
    });
  </script>
  <script>
    // Mientras main.js carga (en el móvil puede tardar), el menú lo avisa; si tocas un modo antes de tiempo, entra solo en cuanto esté listo.
    (function () {
      var menu = document.getElementById('menu-inicio'), btns = menu.querySelectorAll('button'), txt = menu.querySelector('.txt'), elegido = null;
      menu.classList.add('cargando');
      btns.forEach(function (b) { b.addEventListener('click', function () { if (!b.onclick) { elegido = b; txt.textContent = 'Entrando…'; } }); });
      var iv = setInterval(function () {
        if (!document.getElementById('menu-inicio')) return clearInterval(iv);
        if (btns[0].onclick) { clearInterval(iv); menu.classList.remove('cargando'); if (elegido) elegido.click(); }
      }, 100);
    })();
  </script>
</body>
